name: Build VMware OVA

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: Ubuntu LTS version, or 'latest'
        required: true
        default: latest
        type: string
      username:
        description: Linux username to create on first boot
        required: true
        default: serveradmin
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cloud-image-utils qemu-utils jq

      - name: Build OVA
        env:
          UBUNTU_VERSION: ${{ inputs.ubuntu_version }}
          VM_USERNAME: ${{ inputs.username }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          OUTPUT_DIR: dist
        run: bash scripts/build-ova.sh

      - name: Upload OVA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-vmware-ova
          path: dist/*.ova
          if-no-files-found: error
          retention-days: 7